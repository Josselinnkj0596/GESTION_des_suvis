        // --- THEME ---
        function toggleTheme() {
            theme = theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('biztrack_theme', theme);
            applyTheme();
        }

        function applyTheme() {
            const html = document.documentElement;
            if (theme === 'dark') {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
        }

        // --- CORE VIEW SWITCHER ---
        function setView(htmlContent) {
            document.getElementById('app').innerHTML = htmlContent;
            lucide.createIcons();
            applyTheme();
        }

        // --- AUTH ---
        async function runLogin(code, pin) {
            const errDiv = document.getElementById('loginError');
            errDiv.classList.add('hidden');

            const res = await window.BizTrackDB.login(code, pin);
            if (res.success) {
                currentUser = res.user;
                localStorage.setItem('biztrack_current_user', JSON.stringify(currentUser));
                if (currentUser.role === 'admin') {
                    showAdminPanel();
                } else {
                    const clientInfo = await window.BizTrackDB.getClientData(currentUser.code);
                    if (clientInfo.activities.length === 0) {
                        showWizardPanel();
                    } else {
                        showDashboard();
                    }
                }
            } else {
                errDiv.innerText = res.message;
                errDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('biztrack_current_user');
            showLoginScreen();
        }

        // --- UTILS ---
        function formatCurrency(amount, currencyStr) {
            const currencySymbol = currencyStr.split(' ')[0] || currencyStr;
            return new Intl.NumberFormat('fr-FR', { style: 'decimal' }).format(amount) + ' ' + currencySymbol;
        }

        function filterByPeriod(dataArray, period, dateField = 'date') {
            const todayStr = '2026-07-29';
            const today = new Date(todayStr);
            
            return dataArray.filter(item => {
                if (!item[dateField]) return false;
                const itemDate = new Date(item[dateField]);
                
                if (period === 'today') {
                    return item[dateField] === todayStr;
                } else if (period === 'this-week') {
                    const diffTime = Math.abs(today - itemDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    return diffDays <= 7 && itemDate <= today;
                } else if (period === 'this-month') {
                    return itemDate.getFullYear() === 2026 && itemDate.getMonth() === 6; // July
                } else if (period === 'this-year') {
                    return itemDate.getFullYear() === 2026;
                }
                return true;
            });
        }

                showSalesTab();
            } else if (tabId === 'expenses') {

        function changePeriod(period) {
            currentPeriod = period;

        function initDashboardCharts(clientInfo, filteredSales, filteredExpenses) {
            if (charts.revenue) charts.revenue.destroy();
            if (charts.activity) charts.activity.destroy();

            const timelineData = {};
            filteredSales.forEach(s => {
                if (!timelineData[s.date]) timelineData[s.date] = { rev: 0, exp: 0 };
                timelineData[s.date].rev += s.total;
            });
            filteredExpenses.forEach(e => {
                if (!timelineData[e.date]) timelineData[e.date] = { rev: 0, exp: 0 };
                timelineData[e.date].exp += e.amount;
            });

            const sortedDates = Object.keys(timelineData).sort();
            const revenues = sortedDates.map(d => timelineData[d].rev);
            const expenses = sortedDates.map(d => timelineData[d].exp);

            const isDark = theme === 'dark';
            const gridColor = isDark ? '#1e293b' : '#f1f5f9';
            const textColor = isDark ? '#94a3b8' : '#475569';

            const ctx1 = document.getElementById('revenueLineChart').getContext('2d');
            charts.revenue = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [
                        { label: 'Recettes (CA)', data: revenues, borderColor: '#10B981', backgroundColor: 'rgba(16, 185, 129, 0.05)', borderWidth: 2, tension: 0.3, fill: true },
                        { label: 'Dépenses', data: expenses, borderColor: '#F59E0B', backgroundColor: 'rgba(245, 158, 11, 0.05)', borderWidth: 2, tension: 0.3, fill: true }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: gridColor }, ticks: { color: textColor } },
                        y: { grid: { color: gridColor }, ticks: { color: textColor } }
                    },
                    plugins: {
                        legend: { labels: { color: textColor } }
                    }
                }
            });

            const activityStats = {};
            filteredSales.forEach(s => {
                const actName = clientInfo.activities.find(a => a.id === s.activityId)?.name || 'Inconnu';
                if (!activityStats[actName]) activityStats[actName] = 0;
                activityStats[actName] += s.total;
            });

            const actLabels = Object.keys(activityStats);
            const actData = Object.values(activityStats);
            const colorsPreset = ['#1E3A8A', '#10B981', '#3B82F6', '#84CC16', '#F59E0B'];

            const ctx2 = document.getElementById('activityPieChart').getContext('2d');
            charts.activity = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: actLabels.length > 0 ? actLabels : ['Aucune vente'],
                    datasets: [{
                        data: actData.length > 0 ? actData : [1],
                        backgroundColor: actLabels.length > 0 ? colorsPreset.slice(0, actLabels.length) : ['#e2e8f0']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: textColor } }
                    }
                }
            });
        }

        async function runGenerateReport() {

            const expenses = filterByPeriod(clientInfo.expenses, period, 'date');

            const rev = sales.reduce((acc, s) => acc + s.total, 0);
            const exp = expenses.reduce((acc, e) => acc + e.amount, 0);

            const actSummary = {};
            sales.forEach(s => {
                const actName = clientInfo.activities.find(a => a.id === s.activityId)?.name || 'Autre';
                if (!actSummary[actName]) actSummary[actName] = { sales: 0, revenue: 0 };
                actSummary[actName].sales++;
                actSummary[actName].revenue += s.total;
            });

            const periodsLabels = { 'today': "Journalier - 29 Juillet 2026", 'this-week': "Hebdomadaire", 'this-month': "Mensuel - Juillet 2026", 'this-year': "Annuel - Exercice 2026" };

                        <div class="bg-emerald-50/50 dark:bg-emerald-950/30 p-3 rounded-xl border border-emerald-100 dark:border-emerald-900/50">
                            <span class="text-slate-400 font-bold uppercase tracking-wider">Bénéfice</span>
                            <p class="text-base font-bold text-brand-green mt-1 font-mono">${formatCurrency(profit, clientInfo.currency)}</p>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Ventes par secteur</h4>
                        <table class="min-w-full divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                            <thead class="bg-slate-50 dark:bg-slate-850">
                                <tr>
                                    <th class="px-4 py-2 text-left font-bold text-slate-400">Secteur</th>
                                    <th class="px-4 py-2 text-center font-bold text-slate-400">Transactions</th>
                                    <th class="px-4 py-2 text-right font-bold text-slate-400">Total</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-slate-700 dark:text-slate-300">
                                ${Object.keys(actSummary).map(actName => `
                                    <tr>

                                        <td class="px-4 py-2 text-center">${actSummary[actName].sales}</td>
                                        <td class="px-4 py-2 text-right font-bold text-brand-green font-mono">${formatCurrency(actSummary[actName].revenue, clientInfo.currency)}</td>
                                    </tr>
                                `).join('') || `<tr><td colspan="3" class="px-4 py-6 text-center text-slate-400">Aucune vente enregistrée.</td></tr>`}

        async function runExportCSV() {
            const clientInfo = await window.BizTrackDB.getClientData(currentUser.code);
            const period = document.getElementById('reportPeriod').value;
            const sales = filterByPeriod(clientInfo.sales, period, 'date');

            let csvContent = "data:text/csv;charset=utf-8,ID,Date,Activite,Categorie,Quantite,Prix Unitaire,Total,Client,Mode de Paiement,Observation\n";
            sales.forEach(s => {
                const actName = clientInfo.activities.find(a => a.id === s.activityId)?.name || 'Inconnu';
                const catName = clientInfo.categories.find(c => c.id === s.categoryId)?.name || '—';
                const row = [s.id, s.date, `"${actName}"`, `"${catName}"`, s.quantity, s.unitPrice, s.total, `"${s.clientName || ''}"`, s.paymentMethod, `"${s.observation || ''}"`].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `BizTrack_Export_${currentUser.code}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function runSaveClientSettings() {

        async function runExportJSON() {
            const db = JSON.parse(localStorage.getItem('biztrack_db'));
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "BizTrack_Backup.json");
            dl.click();
        }

        function runImportJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const r = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    localStorage.setItem('biztrack_db', JSON.stringify(parsed));
                    alert("Importation réussie !");
                    showDashboard();
                } catch(err) {
                    alert("Erreur de décodage JSON.");
                }
            };
            r.readAsText(file);
        }
